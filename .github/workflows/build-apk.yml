name: Build & Release Goku V10 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Restore Persistent Debug Keystore (Prevents Package Conflict on Update)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Restoring debug.keystore from GitHub Actions secret DEBUG_KEYSTORE_BASE64..."
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Restoring persistent debug.keystore from repository debug.keystore.base64..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "::error::Missing debug.keystore.base64 (and DEBUG_KEYSTORE_BASE64 secret). Refusing to generate a random keystore because that breaks in-place APK updates."
            exit 1
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Ensure Gradle Wrapper Executable or Fallback
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Run Unit & Robolectric Tests
        run: |
          ${GRADLE_CMD} testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Goku V10 Debug APK
        run: |
          ${GRADLE_CMD} assembleDebug --no-daemon --stacktrace

      - name: Prepare Release APK Filename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Goku-V10-GodMode.apk

      - name: Upload Goku-V10-Debug-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Goku-V10-Debug-APK
          path: Goku-V10-GodMode.apk
          retention-days: 30

      - name: Publish Goku V10 APK to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.${{ github.run_number }}
          name: Goku V10 God-Mode (Build #${{ github.run_number }})
          generate_release_notes: true
          files: |
            Goku-V10-GodMode.apk
