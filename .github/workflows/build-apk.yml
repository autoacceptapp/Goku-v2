name: Build & Release Goku V10 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # Touch the cached CI signing keystore every 5 days so GitHub's 7-day cache TTL never evicts it
    - cron: '0 3 */5 * *'

permissions:
  contents: write

jobs:
  keep-keystore-cache-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Persistent Keystore Cache TTL
        uses: actions/cache/restore@v4
        with:
          path: .ci-keystore
          key: goku-ci-debug-keystore-v1

  build-apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Cache Robolectric Android SDK Jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-sdk-cache-v1-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts') }}
          restore-keys: |
            robolectric-sdk-cache-v1-

      - name: Restore Cached CI Debug Keystore
        uses: actions/cache@v4
        with:
          path: .ci-keystore
          key: goku-ci-debug-keystore-v1

      - name: Prepare Persistent Debug Keystore (Prevents Package Conflict on Update)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .ci-keystore
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Restoring debug.keystore from GitHub Actions secret DEBUG_KEYSTORE_BASE64..."
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Restoring persistent debug.keystore from repository debug.keystore.base64..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ -f ".ci-keystore/debug.keystore" ]; then
            echo "Restoring persistent debug.keystore from GitHub Actions cache..."
            cp .ci-keystore/debug.keystore debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating one-time persistent CI debug.keystore (cached for all future builds)..."
            keytool -genkey -v -keystore .ci-keystore/debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp .ci-keystore/debug.keystore debug.keystore
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Ensure Gradle Wrapper Executable or Fallback
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Assemble Goku V10.1 Debug APK & Run Unit Tests
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          ${GRADLE_CMD} assembleDebug testDebugUnitTest \
            --no-daemon \
            --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Prepare Release APK Filename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Goku-V10-GodMode.apk

      - name: Upload Goku-V10-Debug-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Goku-V10-Debug-APK
          path: Goku-V10-GodMode.apk
          retention-days: 30

      - name: Publish Goku V10 APK to GitHub Releases
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.${{ github.run_number }}
          name: Goku V10 God-Mode (Build #${{ github.run_number }})
          generate_release_notes: true
          files: |
            Goku-V10-GodMode.apk
